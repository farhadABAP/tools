<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABAP Code Refactorer</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-abap.min.js"></script>
<style>
:root {
    --bg-primary: #0d1117;
    --bg-secondary: #161b22;
    --bg-tertiary: #21262d;
    --text-primary: #c9d1d9;
    --text-secondary: #8b949e;
    --accent: #58a6ff;
    --accent-glow: rgba(88, 166, 255, 0.15);
    --border: #30363d;
    --success: #238636;
    --danger: #da3633;
    --warn: #d29922;
    --code-bg: #1e1e1e;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.5; height: 100vh; display: flex; flex-direction: column; }

/* NAV */
nav { background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.logo { font-size: 1.1rem; font-weight: 700; color: var(--accent); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }

/* APP LAYOUT */
.app-container { display: flex; flex: 1; overflow: hidden; }

/* LEFT: INPUT */
 pane-input { width: 40%; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--bg-secondary); }
.pane-header { padding: 0.75rem 1rem; background: var(--bg-tertiary); border-bottom: 1px solid var(--border); font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; display: flex; justify-content: space-between; align-items: center; }
.code-area { flex: 1; width: 100%; background: var(--code-bg); color: var(--text-primary); border: none; padding: 1rem; font-family: "Fira Code", "Consolas", monospace; font-size: 0.85rem; resize: none; outline: none; line-height: 1.6; }
.code-area::placeholder { color: var(--text-secondary); opacity: 0.5; }

/* MIDDLE: RULES */
.pane-rules { width: 30%; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--bg-primary); }
.rules-container { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
.rule-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem; position: relative; transition: border-color 0.2s; }
.rule-card:hover { border-color: var(--accent); }
.rule-row { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; align-items: center; }
.rule-input { flex: 1; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 4px; padding: 0.4rem 0.6rem; color: var(--text-primary); font-family: "Fira Code", monospace; font-size: 0.8rem; }
.rule-input:focus { outline: none; border-color: var(--accent); }
.rule-options { display: flex; gap: 0.75rem; font-size: 0.75rem; color: var(--text-secondary); }
.rule-options label { display: flex; align-items: center; gap: 0.3rem; cursor: pointer; }
.rule-options input { accent-color: var(--accent); }
.btn-remove { position: absolute; top: 0.5rem; right: 0.5rem; background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1rem; padding: 0.2rem; }
.btn-remove:hover { color: var(--danger); }

.btn-add { width: 100%; padding: 0.6rem; background: var(--bg-tertiary); border: 1px dashed var(--border); color: var(--accent); border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; margin-top: 0.5rem; }
.btn-add:hover { background: var(--accent-glow); border-color: var(--accent); }

.preset-bar { padding: 0.75rem 1rem; border-top: 1px solid var(--border); background: var(--bg-secondary); }
.preset-title { font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.5rem; font-weight: 600; }
.preset-btns { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.preset-btn { background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-primary); padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
.preset-btn:hover { border-color: var(--warn); color: var(--warn); }

/* RIGHT: OUTPUT */
.pane-output { width: 30%; display: flex; flex-direction: column; background: var(--bg-secondary); }
.output-container { flex: 1; overflow: auto; position: relative; }
.output-container pre { margin: 0 !important; min-height: 100%; }
.output-container code { font-family: "Fira Code", "Consolas", monospace !important; font-size: 0.82rem !important; }

/* UTILS */
.btn { padding: 0.4rem 0.8rem; border-radius: 4px; border: none; font-weight: 600; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: var(--success); color: white; }
.btn-primary:hover { background: #2ea043; }
.btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

.stats { font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.5rem; text-align: right; }
</style>
</head>
<body>

<nav>
    <a href="#" class="logo">🔄 farhadABAP <span style="font-weight:400; color:var(--text-secondary); font-size:0.9rem;">/ Code Refactorer</span></a>
    <button class="btn btn-primary" onclick="applyRefactoring()">⚡ Apply All Rules</button>
</nav>

<div class="app-container">
    
    <!-- LEFT: INPUT CODE -->
    <div class="pane-input">
        <div class="pane-header">
            <span>📝 Source ABAP Code</span>
            <button class="btn btn-secondary" style="font-size:0.7rem; padding:0.2rem 0.5rem;" onclick="loadSample()">Load Sample</button>
        </div>
        <textarea class="code-area" id="input-code" placeholder="Paste your ABAP code here..."></textarea>
    </div>

    <!-- MIDDLE: RULES -->
    <div class="pane-rules">
        <div class="pane-header">
            <span>⚙️ Replacement Rules</span>
            <button class="btn btn-secondary" style="font-size:0.7rem; padding:0.2rem 0.5rem;" onclick="clearRules()">Clear All</button>
        </div>
        <div class="rules-container" id="rules-container">
            <!-- Rules will be injected here -->
        </div>
        <button class="btn-add" onclick="addRule()">+ Add Replacement Rule</button>
        
        <div class="preset-bar">
            <div class="preset-title">⚡ Quick ABAP Modernization Presets</div>
            <div class="preset-btns">
                <button class="preset-btn" onclick="applyPreset('modern_vars')">wa_ → ls_ / it_ → lt_</button>
                <button class="preset-btn" onclick="applyPreset('prefix_change')">ZOLD_ → ZNEW_</button>
                <button class="preset-btn" onclick="applyPreset('commit_work')">COMMIT WORK → COMMIT ENTITIES</button>
                <button class="preset-btn" onclick="applyPreset('sy_subrc')">Remove SY-SUBRC checks</button>
            </div>
        </div>
    </div>

    <!-- RIGHT: OUTPUT CODE -->
    <div class="pane-output">
        <div class="pane-header">
            <span>✅ Refactored Code</span>
            <button class="btn btn-secondary" style="font-size:0.7rem; padding:0.2rem 0.5rem;" onclick="copyOutput()">Copy</button>
        </div>
        <div class="output-container">
            <pre><code class="language-abap" id="output-code">" Refactored code will appear here...</code></pre>
        </div>
        <div class="stats" id="stats">0 replacements made.</div>
    </div>

</div>

<script>
/* ============================================================
   CORE STATE & INITIALIZATION
   ============================================================ */
let ruleCount = 0;

window.addEventListener('DOMContentLoaded', () => {
    addRule('zz_database', 'zz_finance', true, false);
    addRule('wa_header', 'ls_header', true, false);
    loadSample();
});

/* ============================================================
   RULE MANAGEMENT
   ============================================================ */
function addRule(findVal = '', replaceVal = '', wholeWord = true, matchCase = false) {
    ruleCount++;
    const id = ruleCount;
    const container = document.getElementById('rules-container');
    
    const div = document.createElement('div');
    div.className = 'rule-card';
    div.id = `rule-${id}`;
    div.innerHTML = `
        <button class="btn-remove" onclick="removeRule(${id})" title="Remove rule">×</button>
        <div class="rule-row">
            <input type="text" class="rule-input find-input" placeholder="Find..." value="${findVal}">
            <span style="color:var(--text-secondary)">→</span>
            <input type="text" class="rule-input replace-input" placeholder="Replace..." value="${replaceVal}">
        </div>
        <div class="rule-options">
            <label title="Only match complete words (e.g., 'IN' won't match 'INITIAL')">
                <input type="checkbox" class="whole-word" ${wholeWord ? 'checked' : ''}> Whole Word
            </label>
            <label title="Match exact uppercase/lowercase">
                <input type="checkbox" class="match-case" ${matchCase ? 'checked' : ''}> Match Case
            </label>
        </div>
    `;
    container.appendChild(div);
}

function removeRule(id) {
    const el = document.getElementById(`rule-${id}`);
    if (el) el.remove();
}

function clearRules() {
    document.getElementById('rules-container').innerHTML = '';
    ruleCount = 0;
}

/* ============================================================
   PRESETS
   ============================================================ */
function applyPreset(type) {
    clearRules();
    if (type === 'modern_vars') {
        addRule('wa_', 'ls_', true, false);
        addRule('it_', 'lt_', true, false);
        addRule('g_', 'gv_', true, false);
    } else if (type === 'prefix_change') {
        addRule('ZOLD_', 'ZNEW_', true, true); // Case sensitive for prefixes
    } else if (type === 'commit_work') {
        addRule('COMMIT WORK', 'COMMIT ENTITIES', true, true);
        addRule('COMMIT WORK AND WAIT', 'COMMIT ENTITIES', true, true);
    } else if (type === 'sy_subrc') {
        // This is a simplified preset. Real SY-SUBRC removal requires AST parsing, 
        // but we can at least flag or replace common patterns.
        addRule('IF sy-subrc <> 0.', '" TODO: Modernize exception handling', false, true);
    }
    applyRefactoring();
}

/* ============================================================
   REFACTORING ENGINE
   ============================================================ */
function escapeRegExp(string) {
    // Escapes special regex characters so user input is treated as literal text
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function applyRefactoring() {
    let code = document.getElementById('input-code').value;
    let totalReplacements = 0;
    const ruleCards = document.querySelectorAll('.rule-card');

    ruleCards.forEach(card => {
        const findText = card.querySelector('.find-input').value;
        const replaceText = card.querySelector('.replace-input').value;
        const wholeWord = card.querySelector('.whole-word').checked;
        const matchCase = card.querySelector('.match-case').checked;

        if (!findText) return;

        // Build Regex
        let pattern = escapeRegExp(findText);
        if (wholeWord) {
            pattern = `\\b${pattern}\\b`; // \b ensures we don't replace "IN" inside "INITIAL"
        }
        const flags = matchCase ? 'g' : 'gi';
        const regex = new RegExp(pattern, flags);

        // Count replacements (simple approximation)
        const matches = code.match(regex);
        if (matches) {
            totalReplacements += matches.length;
        }

        // Apply replacement
        code = code.replace(regex, replaceText);
    });

    // Update Output
    const outputEl = document.getElementById('output-code');
    outputEl.textContent = code;
    
    // Re-highlight with Prism
    if (window.Prism) {
        Prism.highlightElement(outputEl);
    }

    // Update Stats
    document.getElementById('stats').textContent = `${totalReplacements} replacement(s) made across ${ruleCards.length} rule(s).`;
}

/* ============================================================
   UTILITIES
   ============================================================ */
function copyOutput() {
    const code = document.getElementById('output-code').textContent;
    navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.pane-output .btn-secondary');
        const prev = btn.innerText;
        btn.innerText = 'Copied!';
        btn.style.background = 'var(--success)';
        btn.style.color = 'white';
        setTimeout(() => { 
            btn.innerText = prev; 
            btn.style.background = ''; 
            btn.style.color = ''; 
        }, 1500);
    });
}

function loadSample() {
    const sample = `REPORT zold_database_report.

DATA: wa_header TYPE zold_header,
      it_items  TYPE TABLE OF zold_item,
      wa_items  TYPE zold_item.

SELECT * FROM zz_database
  INTO CORRESPONDING FIELDS OF TABLE it_items
  WHERE bukrs = '1000'.

IF sy-subrc <> 0.
  WRITE: / 'No data found'.
ENDIF.

LOOP AT it_items INTO wa_items.
  wa_header-zz_db_ref = wa_items-ref.
  MODIFY zz_database FROM wa_header.
ENDLOOP.

COMMIT WORK AND WAIT.`;
    document.getElementById('input-code').value = sample;
    applyRefactoring();
}

// Auto-apply on typing (with slight debounce for performance)
let timeout;
document.getElementById('input-code').addEventListener('input', () => {
    clearTimeout(timeout);
    timeout = setTimeout(applyRefactoring, 300);
});

// Attach event listeners to dynamically added rule inputs
document.getElementById('rules-container').addEventListener('input', () => {
    clearTimeout(timeout);
    timeout = setTimeout(applyRefactoring, 300);
});
</script>
</body>
</html>
