<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABAP Workbench — by farhadABAP</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-abap.min.js"></script>

<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav>
    <a href="#" class="logo">farhadABAP · <span>workbench</span></a>
    <div class="search-wrap">
        <input type="text" id="global-search" placeholder="Search tools, references, snippets…" autocomplete="off">
        <div id="search-results" class="search-results"></div>
    </div>
    <div class="nav-links">
        <a href="https://github.com/farhadABAP/tools" target="_blank">GitHub</a>
    </div>
</nav>

<section class="hero">
    <h1>ABAP Workbench</h1>
    <p>A personal ABAP workshop — generators, references, snippets, and notes. Everything runs in your browser. Copy, paste, done.</p>
</section>

<div class="container">

    <!-- Section tabs -->
    <div class="section-tabs" id="section-tabs"></div>

    <!-- Item tabs (inside current section) -->
    <div class="item-tabs" id="item-tabs"></div>

    <!-- Rendered item goes here -->
    <div id="panel" class="panel"></div>

</div>

<footer>
    <p>Built with plain HTML, CSS, and JavaScript. No frameworks, no build step, no tracking.</p>
    <p style="margin-top:.75rem;">&copy; 2026 farhadABAP.</p>
</footer>

<!-- Core -->
<script src="shared.js"></script>
<script src="registry.js"></script>

<!-- Tools -->
<script src="tools/dict.js"></script>
<script src="tools/reader.js"></script>
<script src="tools/injector.js"></script>
<script src="tools/findreplace.js"></script>
<script src="tools/alv.js"></script>

<!-- Reference stubs -->
<script src="reference/placeholder.js"></script>

<!-- Snippet stubs -->
<script src="snippets/placeholder.js"></script>

<!-- Boot the shell -->
<script>
    Workbench.boot();
</script>

</body>
</html>
